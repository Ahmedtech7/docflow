# Checks that run on the staged Python files before each `git commit`.
# Setup once:  uv sync && uv run pre-commit install
# Run by hand: uv run pre-commit run --all-files
#
# The hooks use the Ruff version pinned in uv.lock, so local, pre-commit and CI
# results match. Nothing is downloaded from other services and no credentials are needed.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ruff-lint
        name: ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
