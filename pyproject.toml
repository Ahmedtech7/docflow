[project]
name = "docflow"
version = "0.1.0"
description = "DocFlow document inventory and validation CLI"
requires-python = ">=3.14"
# The app uses only the Python standard library.
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.0.3",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W: pycodestyle style errors, F: Pyflakes (unused imports, undefined names),
# I: import sorting, B: likely bugs (flake8-bugbear).
select = ["E", "W", "F", "I", "B"]
